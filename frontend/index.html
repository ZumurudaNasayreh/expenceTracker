<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- PHASE 2: build the page here.
       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.
       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button
       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->
  <header>
    <!--   NAVBAR   -->
    <nav class="navbar bg-dark">
      <div class="container-fluid ">
        <h1 class="navbar-brand text-white p-3" href="#">Expense Tracker</h1>

        <!-- Theme Switcher -->
        <div class="dropdown">
          <button id="themeSwitcher" class="btn btn-outline-light dropdown-toggle p-2" type="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            Theme Selection
          </button>
          <ul class="dropdown-menu" ;>
            <li><button class="dropdown-item themeOption " type="button" id="light">☀️ Light</button></li>
            <li><button class="dropdown-item themeOption" type="button" id="dark">🌙 Dark</button></li>
          </ul>
        </div>
      </div>

    </nav>
  </header>

  <main>
    <div class="container mt-4">
      <div class="container mt-4">

        <!--ALTER-->
        <div id="alertContainer"></div>

        <!-- Spinner -->
        <div id="loadingSpinner" class="text-center my-3 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <!--  Cards -->
        <div class="row g-3 mb-4" id="cards">

          <!-- Card 1 -->
          <div class="col-12 col-md-4">
            <div class="card h-100 p-4 border-radius-30">
              <small class="card-body text-center text-secondary p-1">Total</small>
              <h2 class="fw-bold text-center mb-0" id="total">102.8</h2>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="col-12 col-md-4">
            <div class="card h-100 p-4 border-radius-30">
              <small class="card-body text-center text-secondary p-1">Number of Expenses</small>
              <h2 class="fw-bold text-center mb-0" id="NumOfExpenses">5</h2>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="col-12 col-md-4">
            <div class="card h-100 p-4 border-radius-30">
              <small class="card-body text-center text-secondary p-1">Highest Expenses</small>
              <h2 class="fw-bold text-center mb-0" id="HighestExpense">32.5</h2>
              <small class="text-secondary text-center" id="HighestExpenseTitle">Electricity bill</small>
            </div>
          </div>

        </div>


        <!--  Form  -->
        <form id="expenseForm" class="mt-4 bg-body-tertiary p-4 rounded shadow-sm">
          <fieldset class="border p-3 rounded">

            <legend class="float-none w-auto px-2 fs-5 fw-bold">Add New Expense</legend>
            <div class="mb-3">
              <div class="input">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" placeholder="Lunch" required>
                  </div>

                  <div class="col-md-2">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="amount" placeholder="4.50"
                      required>
                  </div>

                  <div class="col-md-3">
                    <label for="category" class="form-label fw-semibold">Category</label>
                    <select class="form-select" id="category" required>
                      <option value="" disabled selected>Select Category...</option>
                      <option value="Food">Food</option>
                      <option value="Transportation">Transportation</option>
                      <option value="Entertainment">Entertainment</option>
                      <option value="Bills">Bills</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <div class="col-md-2">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" placeholder="2023-01-01" required>
                  </div>

                </div>

              </div>


              <div class="col-md-2 mt-4">
                <button type="submit" class="btn btn-primary">Add Expense</button>
              </div>

            </div>

          </fieldset>

        </form>

        <!--  Table  CARD  -->
        <div class="container bg-body-tertiary p-4 rounded shadow-sm mt-4 mb-4">
          <div class="row">

            <!--  Table Header  -->
            <div class="d-flex justify-content-between align-items-center">
              <h4 class="fw-bold mb-0">Expenses</h4>
              <div class="d-flex align-items-center gap-2">
                <label for="categorySelect" class="fw-bold mb-0">Category</label>
                <select id="categorySelect" class="form-select form-select-sm" style="width: auto;">
                  <option selected>All</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Bills">Bills</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <!--  Table original-->
            <div class="table-responsive">
              <table class="table table-striped mt-4 p-4 rounded ">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody id="expenseBodyTable">

                  <!-- Rows will be populated here by JS -->

                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>


      <!-- Edit Modal -->
      <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <form id="editExpenseForm">
              <div class="modal-header">
                <h5 class="modal-title fw-bold" id="editModalLabel">Edit Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                  <label for="editTitle" class="form-label">Title</label>
                  <input type="text" class="form-control" id="editTitle" required>
                </div>
                <div class="mb-3">
                  <label for="editAmount" class="form-label">Amount</label>
                  <input type="number" step="0.01" min="0.01" class="form-control" id="editAmount" required>
                </div>
                <div class="mb-3">
                  <label for="editCategory" class="form-label">Category</label>
                  <select class="form-select" id="editCategory" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="editDate" class="form-label">Date</label>
                  <input type="date" class="form-control" id="editDate" required>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      </div>
  </main>

  <footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
